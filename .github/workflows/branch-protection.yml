# ============================================================================
# Branch Protection Configuration
# ============================================================================
# Este archivo documenta la configuración necesaria para proteger la rama
# develop y requerir que los tests pasen antes de permitir el merge.
#
# NOTA: Esta configuración debe aplicarse manualmente en GitHub:
# Settings -> Branches -> Branch protection rules -> Add rule
# ============================================================================

# Configuración recomendada para la rama 'develop':

# Branch name pattern: develop

# Protect matching branches: ✅ CHECKED

# Require a pull request before merging: ✅ CHECKED
#   - Require approvals: 1 (o más según el equipo)
#   - Dismiss stale PR approvals when new commits are pushed: ✅ CHECKED
#   - Require review from Code Owners: (opcional)

# Require status checks to pass before merging: ✅ CHECKED
#   - Require branches to be up to date before merging: ✅ CHECKED
#   - Status checks that are required:
#     - test-ms-customer (if changed)
#     - test-ms-account (if changed)
#     - test-summary

# Require conversation resolution before merging: ✅ CHECKED (opcional)

# Require signed commits: (opcional, según política del equipo)

# Require linear history: (opcional)

# Include administrators: (opcional)

# Restrict who can push to matching branches:
#   - Solo permitir pushes via Pull Request

# Rules applied to everyone including administrators: (opcional)

# ============================================================================
# Comandos para aplicar via GitHub CLI (gh):
# ============================================================================
# Requiere: gh auth login
#
# Crear regla de protección:
# gh api repos/{owner}/{repo}/branches/develop/protection \
#   --method PUT \
#   --input - <<< '{
#     "required_status_checks": {
#       "strict": true,
#       "contexts": ["test-summary"]
#     },
#     "enforce_admins": true,
#     "required_pull_request_reviews": {
#       "required_approving_review_count": 1,
#       "dismiss_stale_reviews": true
#     },
#     "restrictions": null
#   }'
# ============================================================================
