server:
  port: 8082

spring:
  application:
    name: ms-account
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bankdb?currentSchema=account}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      schema: ${DATABASE_SCHEMA:account}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    default_schema: ${DATABASE_SCHEMA:account}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DATABASE_SCHEMA:account}

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:guest}
  password: ${RABBITMQ_PASSWORD:guest}
  exchange: account.exchange
  queue: account.queue
  routing-key: account.routing.key

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
