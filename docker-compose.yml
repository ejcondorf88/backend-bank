# ============================================================================
# Bank Microservices - Docker Compose
# ============================================================================
# Este archivo levanta todos los servicios en Docker.
# Los servicios se conectan a PostgreSQL en Railway (externo).
#
# USO:
# docker-compose up -d # Levantar todos los servicios
# docker-compose down # Detener todos los servicios
# docker-compose logs -f [servicio] # Ver logs de un servicio
# docker-compose ps # Ver estado de los servicios
#
# CONFIGURACION DE MEMORIA:
# Cada servicio tiene limites de memoria configurados en DOS niveles:
# 1. Contenedor (deploy.resources.limits.memory) - Limite duro de Docker
# 2. JVM (JAVA_OPTS) - Limite de memoria Heap de Java
#
# Regla: memoria_contenedor > memoria_JVM_heap + overhead (~200-300MB)
#
# Servicio | Contenedor | JVM Heap | Stack | Metaspace
# ---------|------------|----------|--------|----------
# RabbitMQ | 512M       | N/A      | N/A    | N/A
# Eureka   | 512M       | 256M     | 1M     | 128M
# Gateway  | 512M       | 256M     | 1M     | 128M
# Customer | 768M       | 512M     | 1M     | 128M
# Account  | 768M       | 512M     | 1M     | 128M
#
# PRE-REQUISITOS:
# 1. Crear los schemas "customer" y "account" en Railway PostgreSQL
# 2. Las imágenes deben estar construidas:
# docker build -t backend-bank/ms-eureka-server:1.0.0 ./ms-eureka-server/
# docker build -t backend-bank/ms-gateway:1.0.0 ./ms-gateway/
# docker build -t backend-bank/ms-customer:1.0.0 ./ms-customer/
# docker build -t backend-bank/ms-account:1.0.0 ./ms-account/
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # RabbitMQ - Message Broker
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - bank-network

  # ==========================================================================
  # Eureka Server - Service Discovery
  # ==========================================================================
  eureka-server:
    build: ./ms-eureka-server
    image: backend-bank/ms-eureka-server:1.0.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      SPRING_APPLICATION_NAME: ms-eureka-server
      # JVM Memory: Using Dockerfile defaults (256MB heap)
      # Override with: JAVA_OPTS="-Xms... -Xmx..." if needed
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - bank-network

  # ==========================================================================
  # API Gateway
  # ==========================================================================
  gateway:
    build: ./ms-gateway
    image: backend-bank/ms-gateway:1.0.0
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: ms-gateway
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # JVM Memory: Using Dockerfile defaults (256MB heap)
      # Override with: JAVA_OPTS="-Xms... -Xmx..." if needed
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 384M
          cpus: '0.3'
    depends_on:
      - eureka-server
    restart: unless-stopped
    networks:
      - bank-network

  # ==========================================================================
  # Customer Microservice
  # ==========================================================================
  ms-customer:
    build: ./ms-customer
    image: backend-bank/ms-customer:1.0.0
    container_name: ms-customer
    ports:
      - "8081:8081"
    environment:
      # Perfil activo
      SPRING_PROFILES_ACTIVE: railway

      # Base de datos (desde .env)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA_CUSTOMER:-customer}

      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      # RabbitMQ (usando el contenedor local)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

      # App
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: ms-customer

      # JVM Memory: Using Dockerfile defaults (512MB heap)
      # Override with: JAVA_OPTS="-Xms... -Xmx..." if needed
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.8'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - eureka-server
      - rabbitmq
    restart: unless-stopped
    networks:
      - bank-network

  # ==========================================================================
  # Account Microservice
  # ==========================================================================
  ms-account:
    build: ./ms-account
    image: backend-bank/ms-account:1.0.0
    container_name: ms-account
    ports:
      - "8082:8082"
    environment:
      # Perfil activo
      SPRING_PROFILES_ACTIVE: railway

      # Base de datos (desde .env)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA_ACCOUNT:-account}

      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      # RabbitMQ (usando el contenedor local)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

      # App
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: ms-account

      # JVM Memory: Using Dockerfile defaults (512MB heap)
      # Override with: JAVA_OPTS="-Xms... -Xmx..." if needed
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.8'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - eureka-server
      - rabbitmq
    restart: unless-stopped
    networks:
      - bank-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  rabbitmq_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  bank-network:
    driver: bridge
    name: bank-network
