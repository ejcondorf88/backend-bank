# ============================================================================
# Bank Microservices - Docker Compose
# ============================================================================
# Este archivo solo levanta RabbitMQ para eventos entre microservicios.
# Los demas servicios (Eureka, Gateway, ms-customer, ms-account) se ejecutan
# localmente con Maven.
#
# USO:
#   docker-compose up -d          # Levantar RabbitMQ
#   docker-compose down            # Detener RabbitMQ
#   docker-compose logs -f rabbitmq  # Ver logs
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # RabbitMQ - Message Broker
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # Puerto AMQP para aplicaciones (Spring AMQP)
      - "15672:15672"    # Puerto UI de administración (Web)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  rabbitmq_data:
    driver: local
