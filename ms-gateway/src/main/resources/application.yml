server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-customer
          uri: lb://ms-customer
          predicates:
            - Path=/api/clients/**
        - id: ms-account
          uri: lb://ms-account
          predicates:
            - Path=/api/accounts/**
        - id: ms-account-movements
          uri: lb://ms-account
          predicates:
            - Path=/api/movements/**
        - id: ms-account-reports
          uri: lb://ms-account
          predicates:
            - Path=/reportes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
