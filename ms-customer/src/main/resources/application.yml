server:
  port: 8081

spring:
  application:
    name: ms-customer
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb?currentSchema=customer
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      schema: customer
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
      default_schema: customer
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: customer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
