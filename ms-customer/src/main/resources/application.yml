server:
  port: 8081

spring:
  application:
    name: ms-customer
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb?currentSchema=customer
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      schema: customer
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
      default_schema: customer
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: customer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  info:
    title: Customer Service API
    description: API REST para la gestion de clientes del sistema bancario. Permite crear, consultar, actualizar y eliminar clientes, asi como gestionar su estado activo/inactivo.
    version: 1.0.0
    contact:
      name: Bank Development Team
      email: dev@bank.com

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest
  exchange:
    customer:
      name: customer.events
      type: topic
      durable: true
  queue:
    customer:
      name: customer.events.queue
      durable: true
      routing-key: customer.#
